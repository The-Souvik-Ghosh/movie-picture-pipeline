name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 311336662880.dkr.ecr.us-east-1.amazonaws.com/frontend
  EKS_CLUSTER_NAME: cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            REACT_APP_MOVIE_API_URL=http://a49d4ed451233442ab1229f89d5c8943-561618017.us-east-1.elb.amazonaws.com

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Update frontend image tag
        run: |
          sed -i "s#newTag: .*#newTag: ${GITHUB_SHA}#" starter/frontend/k8s/kustomization.yaml

      - name: Deploy frontend
        run: |
          kubectl apply -k starter/frontend/k8s
          kubectl rollout status deployment/frontend --timeout=180s
